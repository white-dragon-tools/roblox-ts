name: Publish @next

on:
  workflow_dispatch:

jobs:
  publish:
    if: github.repository == 'white-dragon-tools/roblox-ts' && github.ref == 'refs/heads/alt'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2.3.4

      - name: Install NPM Dependencies
        uses: bahmutov/npm-install@v1

      - name: Publish @next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "noreply@github.com"
          echo "@white-dragon-tools:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          npm version --no-git-tag-version $(cat package.json | jq -r .version)-dev-$(git rev-parse --short HEAD)
          npm publish --tag next
